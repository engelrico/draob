name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit shipped packages (high and critical only)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run licenses
      - run: npm run lint
      - run: npm test
      - run: npm run build
