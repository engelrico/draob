name: Package extension
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cd dist && zip -r ../draob.zip . -x '*.map'
      - uses: actions/upload-artifact@v7
        with:
          name: draob-extension
          path: draob.zip
      # Upload to the Chrome Web Store is manual. See docs/compliance.md.
