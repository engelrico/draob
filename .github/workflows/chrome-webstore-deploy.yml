name: Chrome Web Store Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build extension
        run: npm run build
      - name: Deploy to Chrome Web Store
        run: echo "Manual deployment step required. See docs/compliance.md for instructions."
