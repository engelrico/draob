# Weekly dependency update proposals (pull requests). Nothing is merged automatically.
# See docs/dependencies.md for how to handle them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    # Major versions that must be migrated together, not one by one (see "Offene Hauptversionen" in docs/dependencies.md):
    #  - Babel 8 needs @babel/core, preset-env and preset-react at once
    #  - ESLint 9+ needs the flat config format; eslint-plugin-react-hooks 7 flags code in src/popup/App.jsx
    ignore:
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-react-hooks'
        update-types: ['version-update:semver-major']
    groups:
      # Build and test tooling: all minor and patch updates in one PR. Major versions arrive as single PRs.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # Shipped to users: react and react-dom always together, majors included.
      react:
        patterns: [react, react-dom]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    labels: [dependencies]
    commit-message:
      prefix: 'chore(ci)'
