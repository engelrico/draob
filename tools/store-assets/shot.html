<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;color:#f4f4f6;position:relative;
background:radial-gradient(800px 560px at 80% 45%,rgba(255,208,47,.2),transparent 62%),radial-gradient(600px 400px at 0% 100%,rgba(255,208,47,.07),transparent 60%),#0c0c0e}
.copy{position:absolute;left:90px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;letter-spacing:-.5px;color:#cfcfd6}
.brand img{width:48px;height:48px;border-radius:12px}
h1{font-size:62px;line-height:1.08;font-weight:800;letter-spacing:-1.5px}
h1 em{display:block;font-style:normal;color:#ffd02f}
p{font-size:28px;line-height:1.35;color:#c7c7ce}
.shot{position:absolute;right:110px;top:64px;width:400px;height:672px;border-radius:26px;overflow:hidden;border:1px solid #3a3a44;box-shadow:0 50px 110px rgba(0,0,0,.7),0 0 70px rgba(255,208,47,.14)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
</style></head><body>
<div class="copy"><div class="brand"><img id="logo"><span>draob</span></div><h1 id="t"></h1><p id="s"></p></div>
<div class="shot"><img id="img"></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('logo').src='../../docs/assets/logo.png';
document.getElementById('img').src='.work/shots/'+q.get('img')+'.png';
const t=document.getElementById('t'); const [a,b]=(q.get('title')||'').split('|'); t.innerHTML=''; t.append(a||''); if(b){const e=document.createElement('em'); e.textContent=b; t.append(' ',e);}
document.getElementById('s').textContent=q.get('sub')||'';
</script></body></html>
